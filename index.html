<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07152f">
  <meta name="description" content="A private fantasy chronicle created as an artwork gift.">
  <title>DarkdDestiny's Chronicle</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Manrope:wght@400;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Manrope:wght@400;700;800&display=swap"></noscript>
  <style>
    /*
      DarkdDestiny's Chronicle — original fantasy UI
      Put your images in ./images and update CONFIG in the script below.
    */
    :root {
      --primary: #9b83ff;
      --primary-rgb: 155,131,255;
      --accent: #5de1d2;
      --accent-rgb: 93,225,210;
      --gold: #f6cf78;
      --gold-light: #fff0b9;
      --navy: #07152f;
      --navy-deep: #030817;
      --ink: #eef4ff;
      --muted: #b8c5df;
      --glass: rgba(7, 21, 49, .73);
      --line: rgba(246,207,120,.46);
      --shadow: 0 24px 70px rgba(0,0,0,.38);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--navy-deep); scroll-behavior: smooth; }
    body {
      min-width: 320px; min-height: 100%; margin: 0; overflow-x: hidden;
      background:
        radial-gradient(circle at 18% 7%, rgba(var(--primary-rgb),.22), transparent 28rem),
        radial-gradient(circle at 82% 31%, rgba(var(--accent-rgb),.12), transparent 25rem),
        linear-gradient(150deg, #102d5e 0%, var(--navy) 43%, var(--navy-deep) 100%);
      color: var(--ink);
      font-family: "Manrope", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }
    button { min-height: 44px; border: 0; cursor: pointer; }
    button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    img { display: block; max-width: 100%; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    .ambient-canvas, .confetti-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .ambient-canvas { z-index: 0; }
    .confetti-canvas { z-index: 90; }
    .world { position:fixed; z-index:0; inset:0; overflow:hidden; pointer-events:none; }
    .world::before, .world::after { position:absolute; inset:auto -12vw -26vh; height:49vh; content:""; }
    .world::before {
      opacity:.7;
      background:
        radial-gradient(ellipse at 16% 100%, rgba(42,113,135,.7) 0 19%, transparent 20%),
        radial-gradient(ellipse at 43% 100%, rgba(37,84,122,.86) 0 28%, transparent 29%),
        radial-gradient(ellipse at 75% 100%, rgba(32,78,113,.8) 0 23%, transparent 24%),
        linear-gradient(transparent 40%, rgba(3,12,35,.95) 100%);
      transform: translateY(8%);
    }
    .world::after {
      opacity:.44;
      background:
        radial-gradient(ellipse at 11% 100%, #13274a 0 23%, transparent 24%),
        radial-gradient(ellipse at 51% 100%, #0f2448 0 29%, transparent 30%),
        radial-gradient(ellipse at 95% 100%, #142b4f 0 24%, transparent 25%);
      transform: translateY(17%);
    }
    .cloud { position:absolute; width:46vmax; aspect-ratio:2.7; border-radius:50%; background:radial-gradient(ellipse,rgba(177,219,255,.11),rgba(177,219,255,0) 66%); animation:cloud-drift 33s linear infinite alternate; }
    .cloud.one { top:8%; left:-18%; }
    .cloud.two { top:33%; right:-19%; animation-duration:42s; animation-delay:-15s; }
    @keyframes cloud-drift { from { transform:translate3d(-3vw,-1vh,0) scale(1); } to { transform:translate3d(8vw,3vh,0) scale(1.18); } }

    .app { position:relative; z-index:1; min-height:100dvh; }
    .screen {
      display:none; min-height:100dvh;
      padding:max(22px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
      animation:screen-in .48s cubic-bezier(.2,.85,.25,1) both;
    }
    .screen.is-active { display:flex; }
    @keyframes screen-in { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    .screen--route { align-items:flex-start; padding-top:max(17px,env(safe-area-inset-top)); }
    .route-layout { display:flex; width:min(1160px,100%); min-height:calc(100dvh - max(34px,env(safe-area-inset-top))); flex-direction:column; gap:clamp(24px,3.5vw,43px); margin:0 auto; }

    .ornate-panel {
      position:relative; border:1px solid var(--line); border-radius:24px;
      background:linear-gradient(130deg,rgba(255,255,255,.10),rgba(255,255,255,.025) 34%,rgba(255,255,255,.07)),var(--glass);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.045),var(--shadow);
      backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    }
    .ornate-panel::before, .ornate-panel::after { position:absolute; z-index:1; width:17px; height:17px; content:""; border-color:var(--gold); pointer-events:none; }
    .ornate-panel::before { top:8px; left:8px; border-top:1px solid; border-left:1px solid; }
    .ornate-panel::after { right:8px; bottom:8px; border-right:1px solid; border-bottom:1px solid; }
    .eyebrow { display:flex; align-items:center; gap:9px; margin:0 0 12px; color:var(--gold-light); font-size:.72rem; font-weight:800; letter-spacing:.18em; text-transform:uppercase; }
    .eyebrow::before, .eyebrow::after { width:22px; height:1px; content:""; background:currentColor; opacity:.72; }
    h1, h2, h3, p { margin-top:0; }
    .fantasy-title { font-family:"Cinzel Decorative", Georgia, serif; font-weight:700; letter-spacing:.035em; text-wrap:balance; }
    .body-copy { max-width:62ch; margin:0; color:var(--muted); font-size:clamp(.9rem,1.6vw,1rem); line-height:1.7; }
    .gold-rule { width:min(260px,72%); height:1px; margin:23px auto; background:linear-gradient(90deg,transparent,var(--gold),transparent); box-shadow:0 0 15px rgba(246,207,120,.52); }

    .button {
      position:relative; display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:48px; padding:11px 20px; overflow:hidden;
      border:1px solid rgba(255,239,178,.8); border-radius:14px; color:#211641; background:linear-gradient(135deg,#fff0b4,var(--gold) 50%,#dbaa4e);
      box-shadow:0 8px 0 #84572d,0 16px 30px rgba(0,0,0,.28),0 0 22px rgba(246,207,120,.20);
      font-weight:800; letter-spacing:.02em; text-align:center; transition:transform .2s ease,box-shadow .2s ease,filter .2s ease; -webkit-tap-highlight-color:transparent;
    }
    .button::after { position:absolute; top:-120%; left:-35%; width:28%; height:320%; content:""; background:rgba(255,255,255,.62); transform:rotate(24deg); transition:transform .55s ease; }
    .button:hover { transform:translateY(-3px); filter:saturate(1.1) brightness(1.04); }
    .button:hover::after { transform:translateX(560%) rotate(24deg); }
    .button:active { transform:translateY(3px); box-shadow:0 4px 0 #84572d,0 8px 18px rgba(0,0,0,.25); }
    .button--primary { color:white; border-color:rgba(207,195,255,.78); background:linear-gradient(135deg,#c5b5ff,var(--primary) 49%,#6c4ce6); box-shadow:0 8px 0 #45309f,0 16px 30px rgba(0,0,0,.28),0 0 30px rgba(var(--primary-rgb),.34); }
    .button--primary:active { box-shadow:0 4px 0 #45309f,0 8px 18px rgba(0,0,0,.25); }
    .button--ghost { color:var(--ink); border-color:rgba(255,255,255,.26); background:rgba(7,22,52,.58); box-shadow:inset 0 1px 0 rgba(255,255,255,.12); }
    .button--ghost::after { background:rgba(var(--accent-rgb),.23); }
    .icon-button { display:inline-grid; width:44px; min-width:44px; min-height:44px; place-items:center; border:1px solid rgba(255,255,255,.22); border-radius:14px; color:var(--gold-light); background:rgba(5,17,43,.56); box-shadow:inset 0 1px rgba(255,255,255,.12); font-size:1.08rem; transition:color .2s ease,background .2s ease,transform .2s ease; }
    .icon-button:hover { color:white; background:rgba(var(--primary-rgb),.33); transform:translateY(-2px); }
    .icon-button:disabled { opacity:.48; cursor:not-allowed; transform:none; }

    /* Splash */
    #splash { align-items:center; justify-content:center; text-align:center; }
    .splash-panel { width:min(860px,100%); padding:clamp(32px,7vw,74px) clamp(21px,7vw,88px); overflow:hidden; isolation:isolate; }
    .sigil {
      position:absolute; z-index:-1; top:50%; left:50%; width:min(76vw,590px); aspect-ratio:1; border:1px solid rgba(246,207,120,.38); border-radius:50%;
      background:repeating-radial-gradient(circle,transparent 0 12px,rgba(246,207,120,.09) 13px 14px,transparent 15px 28px),conic-gradient(from 10deg,transparent,rgba(var(--primary-rgb),.20),transparent,rgba(var(--accent-rgb),.16),transparent);
      box-shadow:0 0 80px rgba(var(--primary-rgb),.30),inset 0 0 65px rgba(var(--accent-rgb),.12);
      transform:translate(-50%,-50%); animation:sigil-turn 24s linear infinite;
    }
    .sigil::before, .sigil::after { position:absolute; inset:16%; content:""; border:1px dashed rgba(255,239,178,.43); border-radius:50%; animation:sigil-turn 16s linear infinite reverse; }
    .sigil::after { inset:29%; border-style:solid; border-color:rgba(var(--accent-rgb),.42); animation-duration:10s; }
    @keyframes sigil-turn { to { transform:translate(-50%,-50%) rotate(360deg); } }
    .splash-kicker { justify-content:center; }
    .display-title { margin:0; color:#fff6d9; font-size:clamp(2rem,5vw,4.7rem); line-height:1.14; text-shadow:0 0 26px rgba(var(--primary-rgb),.55),0 2px 0 rgba(0,0,0,.38); }
    .splash-name { display:block; margin-top:8px; color:var(--gold); font-size:clamp(1.04rem,2.5vw,1.65rem); text-shadow:0 0 20px rgba(246,207,120,.58); }
    .splash-description { margin:0 auto 30px; color:#d5def2; line-height:1.75; }
    .begin-button { min-width:min(100%,290px); }
    @keyframes begin-pulse { 50% { scale:1.035; } }
    .tiny-note { margin:21px 0 0; color:rgba(219,229,255,.66); font-size:.78rem; }

    /* Navigation */
    .topbar { padding-right:54px; display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:49px; }
    .brand-mark { display:inline-flex; align-items:center; min-width:0; gap:9px; color:#fff3d2; background:transparent; font-family:"Cinzel Decorative",Georgia,serif; font-size:clamp(.75rem,1.9vw,1rem); font-weight:700; letter-spacing:.04em; text-decoration:none; white-space:nowrap; }
    .brand-mark::before { display:block; width:13px; height:28px; flex:none; content:""; background:linear-gradient(var(--gold-light),var(--gold)); -webkit-mask:var(--emblem-url) center/contain no-repeat; mask:var(--emblem-url) center/contain no-repeat; }
    .topbar-nav { display:flex; align-items:center; gap:7px; }
    .nav-button { min-height:40px; padding:8px 11px; border-radius:11px; color:rgba(237,244,255,.75); background:transparent; font-size:.78rem; font-weight:800; letter-spacing:.04em; transition:background .2s ease,color .2s ease; }
    .nav-button:hover, .nav-button[aria-current="page"] { color:#fff5d6; background:rgba(255,255,255,.10); }
    .audio-toggle { position:fixed; z-index:7; top:max(15px,env(safe-area-inset-top)); right:max(15px,env(safe-area-inset-right)); }

    /* Loading */
    #loading { align-items:center; justify-content:center; }
    .loading-panel { width:min(660px,100%); padding:clamp(29px,6vw,55px); text-align:center; }
    .loading-orb { position:relative; width:98px; aspect-ratio:1; margin:0 auto 25px; border:2px solid rgba(246,207,120,.72); border-radius:50%; background:radial-gradient(circle at 35% 29%,#fff,var(--accent) 5%,var(--primary) 34%,rgba(9,24,62,.15) 68%); box-shadow:0 0 42px rgba(var(--primary-rgb),.65),inset -12px -12px 30px rgba(8,17,48,.62); animation:float-orb 2.8s ease-in-out infinite; }
    .loading-orb::before,.loading-orb::after { position:absolute; inset:-13px; content:""; border:1px solid rgba(var(--accent-rgb),.48); border-radius:50%; animation:sigil-spin 6s linear infinite; }
    .loading-orb::after { inset:-24px 13px; border-color:rgba(246,207,120,.44); animation-duration:4s; animation-direction:reverse; }
    @keyframes float-orb { 50% { transform:translateY(-8px) scale(1.04); box-shadow:0 0 64px rgba(var(--primary-rgb),.9),inset -12px -12px 30px rgba(8,17,48,.62); } }
    @keyframes sigil-spin { to { transform:rotate(360deg); } }
    .loading-title { margin:0 0 11px; color:#fff2cf; font-size:clamp(1.43rem,4vw,2.15rem); }
    .loading-description { margin:0 0 28px; color:var(--muted); line-height:1.65; }
    .progress-wrap { position:relative; height:21px; padding:3px; overflow:hidden; border:1px solid rgba(246,207,120,.73); border-radius:99px; background:rgba(1,8,28,.74); box-shadow:inset 0 2px 7px rgba(0,0,0,.68),0 0 23px rgba(246,207,120,.14); }
    .progress-fill { position:relative; width:100%; height:100%; transform:scaleX(0); transform-origin:left center; overflow:hidden; border-radius:inherit; background:linear-gradient(90deg,#6d52d6,var(--primary),var(--accent),#fff2b2); box-shadow:0 0 17px rgba(var(--accent-rgb),.9); will-change:transform; }
    .progress-fill::after { position:absolute; inset:0; content:""; background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.72) 50%,transparent 65%); animation:progress-glint 1.25s linear infinite; }
    @keyframes progress-glint { from { transform:translateX(-120%); } to { transform:translateX(120%); } }
    .loading-meta { display:flex; justify-content:space-between; gap:14px; margin:8px 3px 23px; color:rgba(235,242,255,.69); font-size:.78rem; font-weight:700; }
    .tip-card { min-height:84px; padding:16px 18px; border:1px solid rgba(255,255,255,.13); border-radius:15px; background:rgba(3,13,36,.4); color:#dceaff; font-size:.86rem; line-height:1.55; }
    .tip-card strong { display:block; margin-bottom:3px; color:var(--gold-light); font-size:.69rem; letter-spacing:.13em; text-transform:uppercase; }
    .skip-loading { margin-top:21px; color:var(--muted); background:transparent; font-size:.8rem; text-decoration:underline; text-underline-offset:4px; }
    .skip-loading:hover { color:white; }

    /* Class cards */
    .selection-header { display:grid; grid-template-columns:1fr auto; align-items:end; gap:20px; }
    .selection-title { margin:0; color:#fff2cf; font-size:clamp(1.65rem,4vw,2.75rem); }
    .carousel-shell { position:relative; width:100%; }
    .carousel-window { width:calc(100% + 36px); margin-left:-18px; overflow:hidden; padding:15px 0 19px; touch-action:pan-y; }
    .carousel-track { display:flex; align-items:stretch; gap:clamp(13px,2.4vw,23px); width:max-content; padding:0 max(18px,calc(50vw - 164px)); transition:transform .48s cubic-bezier(.2,.82,.22,1); }
    .class-card { position:relative; display:flex; width:min(78vw,328px); min-height:466px; padding:0; overflow:hidden; flex:0 0 auto; flex-direction:column; border:1px solid rgba(246,207,120,.35); border-radius:22px; color:var(--ink); background:#0b1b40; box-shadow:0 16px 36px rgba(0,0,0,.35); text-align:left; transform:scale(.91) translateY(8px); transition:transform .4s cubic-bezier(.2,.82,.22,1),border-color .4s ease,box-shadow .4s ease; -webkit-tap-highlight-color:transparent; }
    .class-card::before { position:absolute; z-index:1; top:9px; left:9px; width:25px; height:25px; content:""; border-top:1px solid rgba(255,243,204,.74); border-left:1px solid rgba(255,243,204,.74); pointer-events:none; }
    .class-card.is-selected { z-index:2; border-color:var(--gold); box-shadow:0 23px 52px rgba(0,0,0,.47),0 0 32px rgba(var(--primary-rgb),.38); transform:scale(1) translateY(0); }
    .class-card:hover { border-color:rgba(255,240,180,.9); transform:scale(.95) translateY(-4px); }
    .class-card.is-selected:hover { transform:scale(1.015) translateY(-4px); }
    .class-art { position:relative; height:239px; overflow:hidden; background:linear-gradient(145deg,rgba(var(--primary-rgb),.9),#172e64 47%,#0d1536); }
    .class-art::after { position:absolute; inset:0; content:""; background:linear-gradient(180deg,transparent 28%,rgba(6,14,36,.15) 55%,#0b1b40 100%); }
    .class-art img { width:100%; height:100%; object-fit:cover; filter:blur(8px) saturate(1.04) contrast(1.02); transform:scale(1.06); transition:transform .6s ease; }
    .class-card:hover .class-art img { transform:scale(1.11); }
    .rarity-chip { position:absolute; z-index:2; top:13px; right:13px; padding:5px 9px; border:1px solid rgba(255,248,204,.84); border-radius:99px; color:#2b1649; background:linear-gradient(135deg,#fff6c7,#edb858); box-shadow:0 3px 12px rgba(0,0,0,.3); font-size:.67rem; font-weight:900; letter-spacing:.1em; }
    .class-content { position:relative; z-index:2; display:flex; flex:1; flex-direction:column; padding:0 19px 19px; }
    .class-label { margin:-3px 0 5px; color:var(--accent); font-size:.67rem; font-weight:900; letter-spacing:.15em; text-transform:uppercase; }
    .class-name { margin:0; color:#fff2d0; font-family:"Cinzel Decorative",Georgia,serif; font-size:1.18rem; line-height:1.35; }
    .class-art-title { margin:5px 0 0; color:var(--muted); font-size:.76rem; }
    .class-lore { display:-webkit-box; margin:9px 0 0; overflow:hidden; color:#cedbf2; font-size:.7rem; line-height:1.45; -webkit-box-orient:vertical; -webkit-line-clamp:2; }
    .stat-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; margin-top:11px; }
    .stat { min-width:0; padding:6px 4px; border:1px solid rgba(255,255,255,.13); border-radius:8px; background:rgba(2,11,31,.34); text-align:center; }
    .stat span,.stat strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .stat span { color:var(--muted); font-size:.51rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
    .stat strong { margin-top:2px; color:var(--gold-light); font-size:.65rem; }
    .class-card-select { margin-top:auto; padding-top:15px; color:var(--gold-light); font-size:.74rem; font-weight:800; letter-spacing:.06em; }

    /* Art viewer */
    #viewer { align-items:stretch; padding-bottom:max(17px,env(safe-area-inset-bottom)); }
    .viewer-layout { display:grid; width:min(1270px,100%); min-height:calc(100dvh - max(34px,env(safe-area-inset-top)) - max(17px,env(safe-area-inset-bottom))); grid-template-rows:auto minmax(0,1fr) auto; gap:14px; margin:0 auto; }
    .viewer-heading { display:flex; align-items:center; justify-content:space-between; gap:15px; min-width:0; }
    .viewer-kicker { margin:0 0 4px; color:var(--accent); font-size:.67rem; font-weight:900; letter-spacing:.16em; text-transform:uppercase; }
    .viewer-art-title { overflow:hidden; margin:0; color:#fff3d4; font-size:clamp(1.08rem,2.4vw,1.55rem); text-overflow:ellipsis; white-space:nowrap; }
    .art-stage { position:relative; display:grid; min-height:350px; overflow:hidden; place-items:center; border:1px solid rgba(246,207,120,.68); border-radius:clamp(18px,3vw,29px); background:radial-gradient(circle at 50% 45%,rgba(var(--primary-rgb),.26),transparent 40%),repeating-conic-gradient(from 15deg,rgba(255,255,255,.026) 0 3deg,transparent 3deg 11deg),#06132e; box-shadow:inset 0 0 80px rgba(0,0,0,.66),0 20px 55px rgba(0,0,0,.38),0 0 35px rgba(var(--primary-rgb),.2); isolation:isolate; touch-action:none; }
    .art-stage::before,.art-stage::after { position:absolute; z-index:3; content:""; pointer-events:none; }
    .art-stage::before { inset:10px; border:1px solid rgba(255,245,204,.44); border-radius:inherit; }
    .art-stage::after { inset:0; background:linear-gradient(135deg,rgba(255,255,255,.10),transparent 16% 83%,rgba(246,207,120,.11)); }
    .art-tilt { position:relative; z-index:1; display:grid; width:100%; height:100%; min-height:inherit; overflow:hidden; place-items:center; transform-style:preserve-3d; transition:transform .18s ease-out; will-change:transform; }
    .viewer-image { width:min(100%,1010px); height:100%; max-height:calc(100dvh - 195px); object-fit:contain; user-select:none; -webkit-user-drag:none; will-change:transform; filter:drop-shadow(0 18px 25px rgba(0,0,0,.32)); }
    .art-fallback { position:absolute; z-index:2; display:none; max-width:280px; padding:20px; border:1px solid rgba(246,207,120,.52); border-radius:16px; color:#f8f2df; background:rgba(5,17,43,.84); box-shadow:var(--shadow); font-size:.86rem; line-height:1.55; text-align:center; }
    .art-fallback.is-visible { display:block; }
    .frame-badge { position:absolute; z-index:5; top:18px; left:18px; display:inline-flex; align-items:center; gap:7px; padding:7px 11px; border:1px solid rgba(255,243,194,.88); border-radius:10px; color:#fff6d4; background:linear-gradient(135deg,rgba(111,71,225,.88),rgba(54,36,121,.88)); box-shadow:0 0 22px rgba(var(--primary-rgb),.65); font-size:.72rem; font-weight:900; letter-spacing:.1em; }
    .frame-badge::before { content:"✦"; color:var(--gold); font-size:.95rem; }
    .viewer-hint { position:absolute; z-index:5; right:17px; bottom:16px; max-width:calc(100% - 34px); margin:0; padding:7px 10px; border:1px solid rgba(255,255,255,.14); border-radius:9px; color:rgba(238,246,255,.84); background:rgba(3,13,35,.67); font-size:.7rem; font-weight:700; text-align:right; }
    .viewer-tools { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .tool-cluster { display:flex; align-items:center; gap:8px; }

          <div id="carouselWindow" class="carousel-window" aria-label="Artwork class card"><div id="carouselTrack" class="carousel-track" aria-label="Your artwork"></div></div>

    <section id="viewer" class="screen" aria-labelledby="viewerTitle" aria-hidden="true">
      <div class="viewer-layout">
        <header class="viewer-heading">

          <div class="tool-cluster" aria-label="Artwork zoom controls">
            <button id="zoomOut" class="icon-button" type="button" aria-label="Zoom out">−</button>
            <span id="zoomReadout" class="zoom-readout" aria-live="polite">100%</span>
            <button id="zoomIn" class="icon-button" type="button" aria-label="Zoom in">+</button>

            <button id="tiltButton" class="icon-button" type="button" aria-label="Enable subtle motion tilt" title="Enable subtle motion tilt">◈</button>
            <button id="fullscreenBtn" class="icon-button" type="button" aria-label="Toggle fullscreen (F)" title="Fullscreen (F)">⛶</button>
            <a id="downloadArt" class="icon-button" download aria-label="Download artwork" title="Download artwork">⤓</a>
          </div>

    <section id="quest" class="screen screen--route" aria-labelledby="questTitle" aria-hidden="true">
      <div class="route-layout">
        <header class="topbar">
          <button class="brand-mark" type="button" data-route="splash" aria-label="Return to title screen"><span data-brand></span></button>
          <nav class="topbar-nav" aria-label="Chronicle navigation">
            <button class="nav-button" type="button" data-route="select" data-nav="select"></button>
            <button class="nav-button" type="button" data-route="quest" aria-current="page" data-nav="quest"></button>
          </nav>
        </header>
        <div class="quest-content">
          <article class="quest-copy ornate-panel">
            <p id="questEyebrow" class="eyebrow"></p>
            <h1 id="questTitle" class="fantasy-title quest-title"></h1>

  </main>

  <div id="summonModal" class="summon-modal" role="dialog" aria-modal="true" aria-labelledby="summonTitle" aria-describedby="summonStatus" hidden>
    <div class="magic-circle" aria-hidden="true"></div>
    <div class="summon-content">
      <p id="summonKicker" class="summon-kicker"></p>
      <h2 id="summonTitle" class="fantasy-title summon-title"></h2>
      <div class="summon-card"><img id="summonImage" alt=""></div>
      <p id="summonStatus" class="summon-status" aria-live="polite"></p>
      <button id="skipSummon" class="summon-skip" type="button"></button>
    </div>
  </div>

  <script>
    /*
     If you have made it this far, you must have a very big reason. Go for it, I hope you make it because you're not a failure like me.
     PERSONALIZE HERE                                                     
     Change text , colors, and artwork entries in CONFIG.
     ALL THE BEST FOR WHOEVER SEES THIS CODE AFTER ME   
    */
    const CONFIG = {
      recipient: "DarkdDestiny",
      siteTitle: "Moonlight", // Change this to your [SITE TITLE] You can give the title name name you wanted to your story to be.
      colors: {
        primary: "#9b83ff", // [PRIMARY COLOR] Every color has a deep meaning, I hope the your color shines bright to make a change
        accent: "#5de1d2",  // [ACCENT COLOR] Take the help of your friend and family. You're not alone.
        gold: "#f6cf78",
        navy: "#07152f"
      },
      copy: {
        splashKicker: "A quest, that came from a small idea",
        splashDescription: "A small fantasy world built for our legendary adventurer. An artwork is waiting to be discovered.",
        splashNote: " Tap, swipe, and explore at your own pace",
        begin: "Tap to Begin Your Chronicle",
        loadingTitle: "Summoning a promised reward…",
        loadingDescription: "Peek a Boo DarkdDestiny!",
        loadingStatus: "Preparing the archive of bright things, brave moments, and a little bit of magic.",
        tipLabel: "Messages",
        skipLoading: "Jump to the reward",
        selectionEyebrow: "A small promise",
        selectionTitle: "Fading memory",
        cardPrompt: "Tap to summon",
        summon: "Summon Artwork",
        questNav: "Quest",
        selectNav: "Chronicle",
        viewerKicker: "Legendary artwork unlocked",
        viewerHint: "Drag · scroll · keys: + − 0 F",
        secret: "A hidden sigil stirs… you found the secret feather.",
        zoomReset: "Reset",
        tiltOn: "Tilt enabled",
        tiltOff: "Tilt disabled",
        tiltPermission: "Motion tilt needs device permission. Mouse tilt still works on desktop.",
        summonKicker: "A little gift for you",
        summonStatus: "The magic circle is opening…",
        skipSummon: "Reveal now",
        questEyebrow: "Quest complete",
        questTitle: "A small token of admiration",
        claimReward: "View the artwork",
        claimNote: "Hehe~",
        rewardToast: "your legendary reward is ready.",
        unavailableArt: "Artwork unavailable. Add the image file or update its path in CONFIG.",
        audioUnavailable: "Audio is waiting for files in CONFIG.",
        audioOn: "Ambient sound on",
        audioOff: "Ambient sound off",
        audioBlocked: "Your browser needs one more tap before it can play audio."
      },
      tips: [
        " A little gift for you, from this goofball",
        " To my final boss, a little surprise",
        " Legend says DarkdDestiny’s smile grants the whole community +99 morale"
      ],
      personalMessage: "Hi Dark\nA little chronicle is a quest for you Dark. I tried adding the mechanics of the game Dragonicle. I hope you like it and do let me know if you want to add something. This is my first time working on something like this, a website with a game mechanics.\n\nThank you Baka",
      audio: {
        ambientUrl: "coffee_at_midday.mp3",
        clickUrl: ""
      },
      // Keep the artwork file beside this HTML file so the page also works offline.
      artwork: {
        className: "A COLD WINTER NIGHT",
        classLabel: "Final Boss",
        title: "",
        image: "IMG_2847.jpeg",
        thumb: "", // optional: small copy (~600px wide) used for the blurred card + reveal. Falls back to image.
        width: 2604, height: 3949, // intrinsic size of image (prevents layout shift)
        alt: "A detailed pencil drawing of a woman holding an umbrella in a city on a rainy winter night",
        rarity: "SSR",
        date: "16-10-2026", // shown on the artwork screen; leave "" to hide
        lore: "A small step into a world sketched especially for DarkdDestiny.",
        stats: { Creativity: "Perfectionist", Effort: "MAX", skill: "∞" }
      }
    };

    (function () {
      "use strict";

      const q = function (selector, scope) {
        return (scope || document).querySelector(selector);
      };
      const qa = function (selector, scope) {
        return Array.from((scope || document).querySelectorAll(selector));
      };
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const finePointer = window.matchMedia("(hover: hover) and (pointer: fine)");
      const resizeHooks = [];

      const state = {
        screen: "splash",
        previousScreen: "select",
        loadingFrame: 0,
        loadingTimer: 0,
        tipTimer: 0,
        loadingStarted: 0,
        loadingComplete: false,
        summonTimer: 0,
        toastTimer: 0,
        zoom: 1,
        panX: 0,
        panY: 0,
        pointers: new Map(),
        pinchDistance: 0,
        pinchZoom: 1,
        drag: null,
        transformFrame: 0,
        tiltX: 0,
        tiltY: 0,
        tiltFrame: 0,
        tiltEnabled: false,
        claimed: false,
        ambientAudio: null,
        isMuted: true
      };

      const dom = {
        screens: qa(".screen"),
        toast: q("#toast"),
        audioToggle: q("#audioToggle"),
        carouselWindow: q("#carouselWindow"),
        carouselTrack: q("#carouselTrack"),
        progress: q("#loadingProgress"),
        progressFill: q("#progressFill"),
        progressLabel: q("#progressLabel"),
        tipText: q("#tipText"),
        viewerTitle: q("#viewerTitle"),
        viewerRarity: q("#viewerRarity"),
        viewerImage: q("#viewerImage"),
        viewerHint: q("#viewerHint"),
        artStage: q("#artStage"),
        artTilt: q("#artTilt"),
        artFallback: q("#artFallback"),
        zoomReadout: q("#zoomReadout"),
        tiltButton: q("#tiltButton"),
        summonModal: q("#summonModal"),
        summonTitle: q("#summonTitle"),
        summonImage: q("#summonImage"),
        summonStatus: q("#summonStatus"),
        claimNote: q("#claimNote"),
        ambientCanvas: q("#ambientCanvas"),
        confettiCanvas: q("#confettiCanvas")
      };

      function text(node, value) {
        if (node) node.textContent = value == null ? "" : String(value);
      }

      function art() {
        return CONFIG.artwork;
      }

      function format(template, values) {
        return String(template).replace(/\{(\w+)\}/g, function (_, key) {
          return values[key] == null ? "" : values[key];
        });
      }

      function hexToRgb(value) {
        const clean = String(value).trim().replace("#", "");
        const hex = clean.length === 3 ? clean.split("").map(function (item) { return item + item; }).join("") : clean;
        const number = Number.parseInt(hex, 16);
        if (Number.isNaN(number)) return "155,131,255";
        return [(number >> 16) & 255, (number >> 8) & 255, number & 255].join(",");
      }

      function setColors() {
        const root = document.documentElement;
        root.style.setProperty("--primary", CONFIG.colors.primary);
        root.style.setProperty("--accent", CONFIG.colors.accent);
        root.style.setProperty("--gold", CONFIG.colors.gold);
        root.style.setProperty("--navy", CONFIG.colors.navy);
        root.style.setProperty("--primary-rgb", hexToRgb(CONFIG.colors.primary));
        root.style.setProperty("--accent-rgb", hexToRgb(CONFIG.colors.accent));
      }

      function fallbackSvg(current) {
        const safeTitle = String(current.title).replace(/[&<>"]/g, "");
        const safeClass = String(current.className).replace(/[&<>"]/g, "");
        const primary = CONFIG.colors.primary;
        const accent = CONFIG.colors.accent;
        const gold = CONFIG.colors.gold;
        const svg = [
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1080" role="img" aria-label="Artwork placeholder">',
          '<defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="', primary, '"/><stop offset=".55" stop-color="#102e62"/><stop offset="1" stop-color="#050d25"/></linearGradient>',
          '<radialGradient id="g"><stop stop-color="', accent, '" stop-opacity=".9"/><stop offset="1" stop-color="', accent, '" stop-opacity="0"/></radialGradient></defs>',
          '<rect width="800" height="1080" fill="url(#b)"/><circle cx="400" cy="440" r="250" fill="url(#g)" opacity=".58"/>',
          '<path d="M400 155l30 174 154-85-85 154 174 30-174 30 85 154-154-85-30 174-30-174-154 85 85-154-174-30 174-30-85-154 154 85z" fill="', gold, '" opacity=".48"/>',
          '<circle cx="400" cy="440" r="202" fill="none" stroke="', gold, '" stroke-width="3" opacity=".78"/>',
          '<text x="400" y="790" fill="white" font-family="Georgia,serif" font-size="37" text-anchor="middle">', safeClass, '</text>',
          '<text x="400" y="842" fill="#f6cf78" font-family="Arial,sans-serif" font-size="23" text-anchor="middle">add your artwork in /images</text>',
          '<text x="400" y="888" fill="#dbe9ff" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">', safeTitle, '</text></svg>'
        ].join("");
        return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
      }

      function setArtworkImage(image, current, eager, onMissing, useThumb) {
        const full = current.image;
        const first = useThumb && current.thumb ? current.thumb : full;
        image.dataset.fallback = "";
        image.alt = current.alt || current.title;
        image.loading = eager ? "eager" : "lazy";
        image.decoding = "async";
        image.fetchPriority = eager ? "high" : "low";
        image.width = current.width || 2604;
        image.height = current.height || 3949;
        image.onerror = function () {
          if (first !== full && image.dataset.fallback !== "thumb") {
            image.dataset.fallback = "thumb"; // thumb missing: try the full file once
            image.src = full;
            return;
          }
          if (image.dataset.fallback === "true") return;
          image.dataset.fallback = "true";
          image.src = fallbackSvg(current);
          image.alt = current.title + " — placeholder artwork";
          if (onMissing) onMissing();
        };
        image.src = first;
      }

      // Warm the HTTP cache while the loading screen plays, so the reveal and viewer don't stall on a big JPEG.
      function preloadArt() {
        if (state.preloaded) return;
        state.preloaded = true;
        const c = art();
        [c.thumb, c.image].forEach(function (src, i) {
          if (!src) return;
          const img = new Image();
          img.decoding = "async";
          if (i) img.fetchPriority = "low";
          img.src = src;
          if (img.decode) img.decode().catch(function () {});
        });
      }

      function hydrateCopy() {
        document.title = CONFIG.siteTitle + " · " + CONFIG.recipient + "'s Chronicle";
        setColors();
        text(q("#splashKicker"), CONFIG.copy.splashKicker);
        text(q("#splashTitle"), CONFIG.siteTitle + "'s Chronicle");
        splitChars(q("#splashTitle"));
        splitChars(q("#splashName"));
        q("#splashName").classList.add("wave");
        typeSplit(q("#questLetter"));
        document.body.dataset.screen = "splash";
        text(q("#splashName"), "For " + CONFIG.recipient);
        text(q("#splashDescription"), CONFIG.copy.splashDescription);
        text(q("#splashNote"), CONFIG.copy.splashNote);
        text(q("#beginButton"), CONFIG.copy.begin);
        text(q("#loadingTitle"), CONFIG.copy.loadingTitle);
        text(q("#loadingDescription"), CONFIG.copy.loadingDescription);
        text(q("#loadingStatus"), CONFIG.copy.loadingStatus);
        text(q("#tipLabel"), CONFIG.copy.tipLabel);
        text(q("#skipLoading"), CONFIG.copy.skipLoading);
        text(q("#selectionEyebrow"), CONFIG.copy.selectionEyebrow);
        text(q("#selectTitle"), CONFIG.copy.selectionTitle);
        text(q("#viewerKicker"), CONFIG.copy.viewerKicker + (art().date ? " · " + art().date : ""));
        text(dom.viewerHint, CONFIG.copy.viewerHint);
        text(q("#zoomReset"), CONFIG.copy.zoomReset);
        text(q("#summonKicker"), CONFIG.copy.summonKicker);
        text(dom.summonStatus, CONFIG.copy.summonStatus);
        text(q("#skipSummon"), CONFIG.copy.skipSummon);
        text(q("#questEyebrow"), CONFIG.copy.questEyebrow);
        text(q("#questTitle"), CONFIG.copy.questTitle);
        text(q("#questLetter"), CONFIG.personalMessage);
        text(q("#claimReward"), CONFIG.copy.claimReward);
        text(q("#emblemText"), CONFIG.recipient);
        text(q("#brandText"), CONFIG.siteTitle);
        qa("[data-brand]").forEach(function (node) { text(node, CONFIG.siteTitle); });
        qa("[data-nav='select']").forEach(function (node) { text(node, CONFIG.copy.selectNav); });
        qa("[data-nav='quest']").forEach(function (node) { text(node, CONFIG.copy.questNav); });
        updateClaimCopy();
      }

      function createClassArt(current) {
        const wrap = document.createElement("div");
        const image = document.createElement("img");
        const rarity = document.createElement("span");
        wrap.className = "class-art";
        rarity.className = "rarity-chip";
        text(rarity, current.rarity);
        setArtworkImage(image, current, false, null, true);
        wrap.append(image, rarity);
        return wrap;
      }

      function statText(stats) {
        return Object.entries(stats).map(function (entry) {
          return entry[0] + ": " + entry[1];
        }).join(", ");
      }

      function renderCarousel() {
        const current = art();
        const card = document.createElement("button");
        const content = document.createElement("div");
        const label = document.createElement("p");
        const className = document.createElement("h2");
        const title = document.createElement("p");
        const lore = document.createElement("p");
        const statGrid = document.createElement("div");
        const prompt = document.createElement("p");
        const accessibleStats = document.createElement("span");

        card.type = "button";
        card.className = "class-card is-selected";
        card.setAttribute("aria-label", current.classLabel + ": " + current.className + ", " + current.title + ". " + CONFIG.copy.cardPrompt);
        content.className = "class-content";
        label.className = "class-label";
        className.className = "class-name";
        title.className = "class-art-title";
        lore.className = "class-lore";
        statGrid.className = "stat-grid";
        prompt.className = "class-card-select";
        accessibleStats.className = "sr-only";
        text(label, current.classLabel);
        text(className, current.className);
        text(title, current.title);
        text(lore, current.lore);
        text(prompt, CONFIG.copy.cardPrompt);
        text(accessibleStats, statText(current.stats));
        Object.entries(current.stats).forEach(function (entry) {
          const stat = document.createElement("span");
          const statLabel = document.createElement("span");
          const statValue = document.createElement("strong");
          stat.className = "stat";
          text(statLabel, entry[0]);
          text(statValue, entry[1]);
          stat.append(statLabel, statValue);
          statGrid.append(stat);
        });
        content.append(label, className, title, lore, statGrid, prompt, accessibleStats);
        card.append(createClassArt(current), content);
        card.addEventListener("click", openSummon);
        dom.carouselTrack.replaceChildren(card);

      }

      function updateViewerArtwork(eager) {
        const current = art();
        if (!current) return;
        text(dom.viewerTitle, current.title);
        text(dom.viewerRarity, current.rarity);
        dom.artFallback.classList.remove("is-visible");
        text(dom.artFallback, "");
        setArtworkImage(dom.viewerImage, current, Boolean(eager), function () {
          text(dom.artFallback, CONFIG.copy.unavailableArt);
          dom.artFallback.classList.add("is-visible");
        });
        dom.viewerImage.onload = function () {
          dom.artFallback.classList.remove("is-visible");
        };
      }

      function setNavState(screen) {
        qa("[data-nav]").forEach(function (node) {
          if (node.dataset.nav === screen) node.setAttribute("aria-current", "page");
          else node.removeAttribute("aria-current");
        });
      }

      function goTo(screen, options) {
        const opts = options || {};
        if (!q("#" + screen)) return;
        if (state.screen === "loading" && screen !== "loading") stopLoading();
        if (screen !== "viewer") resetView(false);
        if (["select", "quest"].includes(screen) && !opts.fromViewer) state.previousScreen = screen;
        state.screen = screen;
        document.body.dataset.screen = screen;
        dom.screens.forEach(function (node) {
          const active = node.id === screen;
          if (active) node.classList.remove("is-leaving");
          else if (node.classList.contains("is-active") && !reducedMotion.matches) {
            node.classList.add("is-leaving");
            window.setTimeout(function () { node.classList.remove("is-leaving"); }, 230);
          }
          node.classList.toggle("is-active", active);
          node.setAttribute("aria-hidden", String(!active));
        });
        setNavState(screen);
        if (screen === "viewer") {
          updateViewerArtwork(true);
          resetView(true);
        }
        if (!opts.keepFocus) {
          const target = q("#" + screen + " h1") || q("#" + screen + " button");
          if (target) window.setTimeout(function () { target.focus({ preventScroll: true }); }, 55);
        }
      }

      function setLoadingProgress(value) {
        if (value === state.lastProgress) return;
        state.lastProgress = value;
        dom.progressFill.style.transform = "scaleX(" + value / 100 + ")";
        dom.progress.setAttribute("aria-valuenow", String(value));
        text(dom.progressLabel, value + "%");
      }

      function beginLoading() {
        clearTimeout(state.loadingTimer);
        clearTimeout(state.tipTimer);
        cancelAnimationFrame(state.loadingFrame);
        state.loadingComplete = false;
        state.loadingStarted = performance.now();
        goTo("loading", { keepFocus: true });
        preloadArt();
        rotateTip(0);
        runLoading();
      }

      function runLoading(now) {
        const timestamp = now == null ? performance.now() : now;
        const duration = reducedMotion.matches ? 130 : 2200;
        const raw = Math.min(1, (timestamp - state.loadingStarted) / duration);
        const eased = 1 - Math.pow(1 - raw, 3);
        setLoadingProgress(Math.round(eased * 100));
        if (raw < 1) state.loadingFrame = requestAnimationFrame(runLoading);
        else state.loadingTimer = window.setTimeout(finishLoading, reducedMotion.matches ? 0 : 280);
      }

      function rotateTip(index) {
        if (state.screen !== "loading") return;
        text(dom.tipText, CONFIG.tips[index % CONFIG.tips.length]);
        if (dom.tipText.animate && !reducedMotion.matches) dom.tipText.animate([{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }], { duration: 320, easing: "ease-out" });
        state.tipTimer = window.setTimeout(function () { rotateTip(index + 1); }, 710);
      }

      function stopLoading() {
        cancelAnimationFrame(state.loadingFrame);
        clearTimeout(state.loadingTimer);
        clearTimeout(state.tipTimer);
      }

      function finishLoading() {
        if (state.loadingComplete) return;
        state.loadingComplete = true;
        stopLoading();
        setLoadingProgress(100);
        goTo("select");
      }

      function openSummon() {
        const current = art();
        clearTimeout(state.summonTimer);
        setArtworkImage(dom.summonImage, current, true, null, true);
        text(dom.summonTitle, current.title);
        text(dom.summonStatus, CONFIG.copy.summonStatus);
        dom.summonModal.hidden = false;
        document.body.style.overflow = "hidden";
        q("#skipSummon").focus({ preventScroll: true });
        state.summonTimer = window.setTimeout(completeSummon, reducedMotion.matches ? 60 : 1380);
      }

      function completeSummon() {
        clearTimeout(state.summonTimer);
        dom.summonModal.hidden = true;
        document.body.style.overflow = "";
        goTo("viewer");
      }

      function closeSummon() {
        clearTimeout(state.summonTimer);
        dom.summonModal.hidden = true;
        document.body.style.overflow = "";
        goTo("select");
      }

      function resetView(announce) {
        state.zoom = 1;

      function setUpEmblem() {

        const uri = "data:image/svg+xml," + encodeURIComponent(svg);

        let taps = 0, tapTimer = 0;
        document.addEventListener("click", function (e) {
          const em = e.target.closest(".emblem");
          if (!em) return;
          const r = em.getBoundingClientRect();
          if (!reducedMotion.matches) {
            emit(r.left + r.width / 2, r.top + r.height * .35, 26, 7);
            em.classList.remove("is-pulse"); void em.offsetWidth; em.classList.add("is-pulse");

      function setUpMotion() {
        if (reducedMotion.matches) return;
        document.addEventListener("pointerdown", function (e) {
          if (e.target.closest(".button, .class-card, .icon-button")) emit(e.clientX, e.clientY, 14, 5);
          const btn = e.target.closest(".button");
          if (!btn) return;
          const r = btn.getBoundingClientRect();
          const d = Math.max(r.width, r.height) * 2;
          const ripple = document.createElement("span");
          ripple.className = "ripple";
          ripple.style.cssText = "width:" + d + "px;height:" + d + "px;left:" + (e.clientX - r.left - d / 2) + "px;top:" + (e.clientY - r.top - d / 2) + "px";

          ripple.addEventListener("animationend", function () { ripple.remove(); });
        }, { passive: true });

        const world = q(".world");
        const emblems = qa(".emblem");
        let frame = 0, px = 0, py = 0;
        let trail = 0;
        window.addEventListener("pointermove", function (e) {
          if (e.timeStamp - trail > 45) { trail = e.timeStamp; emit(e.clientX, e.clientY, 1, 1.2); }
          px = e.clientX / window.innerWidth * 2 - 1;
          py = e.clientY / window.innerHeight * 2 - 1;
          if (frame) return;
          frame = requestAnimationFrame(function () {
            frame = 0;
            world.style.setProperty("--px", px.toFixed(3));
            world.style.setProperty("--py", py.toFixed(3));
            emblems.forEach(function (n) { n.style.setProperty("--px", (px * .8).toFixed(3)); n.style.setProperty("--py", (py * .8).toFixed(3)); });
          });
        }, { passive: true });

        const card = q(".class-card", dom.carouselTrack);
        if (!card) return;
        let cardFrame = 0, cx = .5, cy = .5;
        card.addEventListener("pointermove", function (e) {
          const r = card.getBoundingClientRect();
          cx = (e.clientX - r.left) / r.width;
          cy = (e.clientY - r.top) / r.height;
          if (cardFrame) return;
          cardFrame = requestAnimationFrame(function () {
            cardFrame = 0;
            card.classList.add("is-tracking");
            card.style.setProperty("--ry", ((cx - .5) * 12).toFixed(2) + "deg");
            card.style.setProperty("--rx", ((.5 - cy) * 10).toFixed(2) + "deg");
            card.style.setProperty("--mx", (cx * 100).toFixed(1) + "%");
            card.style.setProperty("--my", (cy * 100).toFixed(1) + "%");
          });
        });
        card.addEventListener("pointerleave", function () {
          cancelAnimationFrame(cardFrame);
          cardFrame = 0;
          card.classList.remove("is-tracking");
          card.style.removeProperty("--rx");
          card.style.removeProperty("--ry");
        });
      }
